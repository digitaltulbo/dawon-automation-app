<h1>다원 자동화</h1>
<p>경기도 성남시 판교 '다원 중국요리전문점'이 가게 운영에 쓰는 내부 도구입니다. 가게 운영자 본인의 Google 계정에서 매출 안내 메일과 Google Drive 매출 파일을 <b>읽기 전용</b>으로 확인해, 하루 매출을 가게 내부 화면에 정리합니다.</p>
<p>일반 사용자에게 제공하는 서비스가 아니며, 다른 사람의 계정에는 접근하지 않습니다.</p>
